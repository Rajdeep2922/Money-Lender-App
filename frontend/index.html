<!doctype html>
<html lang="en">

<head>
  <!-- Ensure Light Mode Only -->
  <script>
    (function () {
      try {
        localStorage.removeItem('money-lender-theme');
        document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8" />

  <!-- Preconnect to external resources for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Professional Money Lender Management System. Manage customers, loans, payments, and agreements efficiently." />
  <meta name="theme-color" content="#494fdf" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

  <title>Money Lender App</title>

  <!-- Critical CSS to prevent layout shift & dark flash -->
  <style>
    html.dark,
    .dark body {
      background-color: #000000 !important;
      color: #ffffff;
    }

    /* Prevent flash of unstyled content */
    #root {
      min-height: 100vh;
      background-color: #f8fafc;
    }

    .dark #root {
      background-color: #000000;
    }

    /* Loading state to prevent white flash */
    #root:empty {
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dark #root:empty {
      background-color: #000000;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
