<!doctype html>
<html lang="en">

<head>
  <!-- Theme Init: Prevent Theme Flash -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('money-lender-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
      } catch (e) {
        console.error('Theme init error:', e);
      }
    })();
  </script>

  <meta charset="UTF-8" />

  <!-- Preconnect to external resources for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Professional Money Lender Management System. Manage customers, loans, payments, and agreements efficiently." />
  <meta name="theme-color" content="#494fdf" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

  <title>Money Lender App</title>

  <!-- Critical CSS to prevent layout shift & dark flash -->
  <style>
    html.dark,
    .dark body {
      background-color: #0C0E14 !important;
      color: #ffffff;
    }

    /* Prevent flash of unstyled content */
    #root {
      min-height: 100vh;
      background-color: #E4EEFB;
    }

    .dark #root {
      background-color: #0C0E14;
    }

    /* Loading state to prevent white flash */
    #root:empty {
      background-color: #E4EEFB;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dark #root:empty {
      background-color: #0C0E14;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
